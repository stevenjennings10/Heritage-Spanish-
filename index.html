<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Juego: C, S o Z</title>

<style>
body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f4f7fb;
    margin:0;
    padding:20px;
}

.container{
    max-width:900px;
    margin:auto;
    background:white;
    padding:20px;
    border-radius:12px;
    box-shadow:0 0 10px rgba(0,0,0,.1);
}

h1{
    text-align:center;
    color:#1e3a8a;
}

#timer{
    font-size:24px;
    font-weight:bold;
    color:#dc2626;
}

.question{
    margin:20px 0;
    padding:15px;
    border:1px solid #ddd;
    border-radius:10px;
    background:#fafafa;
}

.word{
    font-size:24px;
    font-weight:bold;
    margin-bottom:10px;
}

.choice{
    padding:8px 15px;
    margin:5px;
    font-size:18px;
    cursor:pointer;
    border:none;
    border-radius:8px;
    background:#2563eb;
    color:white;
}

.choice:hover{
    background:#1d4ed8;
}

.feedback{
    margin-top:10px;
    font-weight:bold;
}

.correct{
    color:green;
}

.incorrect{
    color:red;
}

#results{
    display:none;
    margin-top:20px;
    text-align:center;
}

input{
    padding:8px;
    font-size:16px;
}

button{
    cursor:pointer;
}

#leaderboard{
    margin-top:30px;
}

#leaderboard ol{
    padding-left:25px;
}

canvas{
    position:fixed;
    top:0;
    left:0;
    pointer-events:none;
    z-index:9999;
}
</style>
</head>

<body>

<div class="container">

<h1>🎯 Juego de Ortografía: C, S o Z</h1>

<p>
Lee cada palabra y selecciona la letra correcta para completar la palabra.
Tienes 2 minutos para responder 10 preguntas.
</p>

<p>⏰ Tiempo restante: <span id="timer">120</span> segundos</p>

<div id="game"></div>

<div id="results">
    <h2>Resultados</h2>

    <p id="score"></p>
    <p id="message"></p>

    <input
        type="text"
        id="playerName"
        placeholder="Tu nombre">

    <button onclick="saveScore()">Guardar puntuación</button>

    <br><br>

    <button onclick="location.reload()">
        Jugar otra vez
    </button>
</div>

<div id="leaderboard">
    <h2>🏆 Tabla de Líderes</h2>
    <ol id="scoresList"></ol>
</div>

</div>

<script>

const questionBank = [

{word:"luce__ita",answer:"c",rule:"Diminutivo (-cita)"},
{word:"piece__ito",answer:"c",rule:"Diminutivo (-cito)"},
{word:"pastor__illo",answer:"c",rule:"Diminutivo (-cillo)"},
{word:"renun__io",answer:"c",rule:"Verbo terminado en -ciar"},
{word:"pronun__io",answer:"c",rule:"Verbo terminado en -ciar"},

{word:"prince__a",answer:"s",rule:"Terminación -esa"},
{word:"conde__a",answer:"s",rule:"Terminación -esa"},
{word:"buení__imo",answer:"s",rule:"Superlativo -ísimo"},
{word:"finí__ima",answer:"s",rule:"Superlativo -ísima"},
{word:"expul__ión",answer:"s",rule:"Proviene de expulsar"},

{word:"esperan__a",answer:"z",rule:"Terminación -anza"},
{word:"puñeta__o",answer:"z",rule:"Terminación -azo"},
{word:"araña__o",answer:"z",rule:"Terminación -azo"},
{word:"honrade__",answer:"z",rule:"Terminación -ez"},
{word:"efica__",answer:"z",rule:"Terminación -az"},
{word:"movedi__o",answer:"z",rule:"Terminación -izo"},
{word:"cabe__azo",answer:"z",rule:"Terminación -azo"},
{word:"firme__a",answer:"z",rule:"Terminación -eza"},
{word:"rique__a",answer:"z",rule:"Terminación -eza"},
{word:"triste__a",answer:"z",rule:"Terminación -eza"}

];

function shuffleArray(array){
    for(let i=array.length-1;i>0;i--){
        let j=Math.floor(Math.random()*(i+1));
        [array[i],array[j]]=[array[j],array[i]];
    }
}

let gameQuestions=[...questionBank];
shuffleArray(gameQuestions);

const selectedQuestions=gameQuestions.slice(0,10);

let score=0;
let answered=0;

const game=document.getElementById("game");

selectedQuestions.forEach((q,index)=>{

    const div=document.createElement("div");
    div.className="question";

    div.innerHTML=`
        <div class="word">${index+1}. ${q.word}</div>

        <button class="choice" onclick="checkAnswer(${index},'c',this)">C</button>
        <button class="choice" onclick="checkAnswer(${index},'s',this)">S</button>
        <button class="choice" onclick="checkAnswer(${index},'z',this)">Z</button>

        <div id="feedback${index}" class="feedback"></div>
    `;

    game.appendChild(div);

});

function checkAnswer(index,letter,btn){

    const question=selectedQuestions[index];

    const parent=btn.parentElement;

    if(parent.dataset.answered==="true"){
        return;
    }

    parent.dataset.answered="true";

    const feedback=document.getElementById("feedback"+index);

    if(letter===question.answer){

        score++;

        feedback.innerHTML=
        `✅ Correcto. (${question.rule})`;

        feedback.className="feedback correct";

    }else{

        feedback.innerHTML=
        `❌ Incorrecto. Respuesta correcta: ${question.answer.toUpperCase()}
        (${question.rule})`;

        feedback.className="feedback incorrect";
    }

    parent.querySelectorAll(".choice").forEach(button=>{
        button.disabled=true;
    });

    answered++;

    if(answered===selectedQuestions.length){
        showResults();
    }
}

let timeLeft=120;
let timerInterval;

function startTimer(){

    timerInterval=setInterval(()=>{

        timeLeft--;

        document.getElementById("timer").textContent=timeLeft;

        if(timeLeft<=0){

            clearInterval(timerInterval);

            document
                .querySelectorAll(".choice")
                .forEach(btn=>btn.disabled=true);

            showResults();
        }

    },1000);
}

function showResults(){

    clearInterval(timerInterval);

    let message="";

    if(score>=8){

        message="🎉 ¡Excelente trabajo!";
        launchConfetti();

    }else if(score>=6){

        message="👍 ¡Muy bien!";

    }else{

        message="📚 Sigue practicando.";
    }

    document.getElementById("score").innerHTML=
        `Puntuación: ${score} / ${selectedQuestions.length}`;

    document.getElementById("message").innerHTML=
        `${message}<br>Tiempo restante: ${timeLeft} segundos`;

    document.getElementById("results").style.display="block";
}

function saveScore(){

    const name=
        document.getElementById("playerName")
        .value
        .trim();

    if(name===""){
        alert("Escribe tu nombre.");
        return;
    }

    let leaderboard=
        JSON.parse(localStorage.getItem("cszLeaderboard"))
        || [];

    leaderboard.push({
        name:name,
        score:score,
        time:timeLeft
    });

    leaderboard.sort((a,b)=>{

        if(b.score===a.score){
            return b.time-a.time;
        }

        return b.score-a.score;
    });

    leaderboard=leaderboard.slice(0,10);

    localStorage.setItem(
        "cszLeaderboard",
        JSON.stringify(leaderboard)
    );

    loadLeaderboard();
}

function loadLeaderboard(){

    let leaderboard=
        JSON.parse(localStorage.getItem("cszLeaderboard"))
        || [];

    const list=document.getElementById("scoresList");

    list.innerHTML="";

    leaderboard.forEach(player=>{

        const li=document.createElement("li");

        li.textContent=
            `${player.name} - ${player.score}/10 (${player.time}s)`;

        list.appendChild(li);
    });
}

function launchConfetti(){

    const canvas=document.createElement("canvas");
    document.body.appendChild(canvas);

    const ctx=canvas.getContext("2d");

    canvas.width=window.innerWidth;
    canvas.height=window.innerHeight;

    const confetti=[];

    for(let i=0;i<250;i++){

        confetti.push({
            x:Math.random()*canvas.width,
            y:Math.random()*canvas.height-canvas.height,
            r:Math.random()*8+2,
            d:Math.random()*250,
            color:`hsl(${Math.random()*360},100%,50%)`
        });
    }

    let angle=0;

    function draw(){

        ctx.clearRect(0,0,canvas.width,canvas.height);

        angle+=0.01;

        for(let i=0;i<confetti.length;i++){

            const p=confetti[i];

            ctx.beginPath();
            ctx.fillStyle=p.color;

            ctx.fillRect(
                p.x,
                p.y,
                p.r,
                p.r
            );

            p.y+=Math.cos(angle+p.d)+3;

            if(p.y>canvas.height){
                p.y=-10;
            }
        }

        requestAnimationFrame(draw);
    }

    draw();

    setTimeout(()=>{
        canvas.remove();
    },5000);
}

loadLeaderboard();
startTimer();

</script>

</body>
</html>
